<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form th:action="@{/authentication/login}" method="post">
    <div>
        <label for="username">Usuario</label>
    <input type="text"  name="username" id="username" class="form-control" required placeholder="">
    </div>

    <div>
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required placeholder="****"></input>
    </div>
    
    
  <button class="btn w-100" type="submit">Ingresar</button>

      
  
</form>

<a th:href="@{/authentication/register}">registrarse</a>
</body>
</html>
