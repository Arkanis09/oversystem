<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="fragments/head :: headAuth('Iniciar sesión | OverSystem')"></th:block>
</head>

<body class="auth-page">

    <div class="auth-transition-layer" aria-hidden="true"></div>

    <div class="auth-background" aria-hidden="true">
        <span class="auth-orb auth-orb-1"></span>
        <span class="auth-orb auth-orb-2"></span>
        <span class="auth-orb auth-orb-3"></span>
    </div>

    <main class="auth-shell">
        <section class="auth-card js-auth-card">

            <div class="auth-brand-row">
                <div class="auth-brand-badge">OS</div>
                <div class="auth-brand-text">
                    <p class="auth-brand-name">OverSystem</p>
                    <p class="auth-brand-copy">Acceso seguro y moderno</p>
                </div>
            </div>

            <div class="auth-form-wrap">
                <div class="auth-form-header">
                    <span class="auth-kicker">Acceso</span>
                    <h1 class="auth-form-title">Iniciar sesión</h1>
                    <p class="auth-form-copy">
                        Ingresa tus credenciales para continuar.
                    </p>
                </div>

                <div class="auth-alert auth-alert-error" th:if="${param.error}">
                    Usuario o contraseña incorrectos.
                </div>

                <div class="auth-alert auth-alert-success" th:if="${param.logout}">
                    Tu sesión se cerró correctamente.
                </div>

                <form th:action="@{/authentication/login}" method="post" class="auth-form">
                    <div class="auth-field">
                        <input
                            type="text"
                            name="username"
                            id="username"
                            class="auth-input"
                            required
                            placeholder=" "
                            autocomplete="username">
                        <label for="username">Usuario</label>
                    </div>

                    <div class="auth-field">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="auth-input"
                            required
                            placeholder=" "
                            autocomplete="current-password">
                        <label for="password">Contraseña</label>

                        <button type="button"
                                class="auth-password-toggle js-password-toggle"
                                data-target="password"
                                aria-label="Mostrar contraseña">
                            <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M12 5c5.23 0 9.27 3.11 11 7-1.73 3.89-5.77 7-11 7S2.73 15.89 1 12c1.73-3.89 5.77-7 11-7zm0 2C8.14 7 5 9.09 3.18 12 5 14.91 8.14 17 12 17s7-2.09 8.82-5C19 9.09 15.86 7 12 7zm0 2.5A2.5 2.5 0 1 1 9.5 12 2.5 2.5 0 0 1 12 9.5z"/>
                            </svg>
                            <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M2.29 3.71 1 5l4.03 4.03A11.85 11.85 0 0 0 1 12c1.73 3.89 5.77 7 11 7a11.4 11.4 0 0 0 4.26-.79L19 21l1.29-1.29zM12 17c-3.86 0-7-2.09-8.82-5a10.3 10.3 0 0 1 3.29-3.43l1.55 1.55A3.96 3.96 0 0 0 8 12a4 4 0 0 0 4 4c.66 0 1.28-.16 1.83-.43l1.54 1.54c-1.04.58-2.21.89-3.37.89zm10.82-5c-.72 1.62-1.86 3.08-3.29 4.2l-1.45-1.45A10.18 10.18 0 0 0 20.82 12C19 9.09 15.86 7 12 7c-.79 0-1.56.09-2.29.27L8.11 5.67C9.34 5.24 10.64 5 12 5c5.23 0 9.27 3.11 11 7zm-7.74.33A4 4 0 0 0 11.67 8.9z"/>
                            </svg>
                        </button>
                    </div>

                    <button class="auth-submit" type="submit">Ingresar</button>

                    <div class="auth-footer">
                        ¿No tienes cuenta?
                        <a class="auth-link js-auth-nav" th:href="@{/authentication/register}">Regístrate</a>
                    </div>
                </form>
            </div>

        </section>
    </main>

    <th:block th:replace="fragments/scripts :: scriptsAuth"></th:block>
</body>
</html>
