<th:block th:fragment="sidebar" xmlns:th="http://www.thymeleaf.org">

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="app-sidebar" id="appSidebar">
        <div class="sidebar-header">
            <div class="sidebar-brand">
                <div class="sidebar-logo">O</div>
                <div class="sidebar-brand-text">
                    <h2>OVERSYSTEM</h2>
                    <span>Panel principal</span>
                </div>
            </div>

            <button type="button" class="sidebar-close" id="sidebarClose" aria-label="Cerrar sidebar">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M18.3 5.71a1 1 0 0 0-1.41 0L12 10.59 7.11 5.7A1 1 0 0 0 5.7 7.11L10.59 12 5.7 16.89a1 1 0 1 0 1.41 1.41L12 13.41l4.89 4.89a1 1 0 0 0 1.41-1.41L13.41 12l4.89-4.89a1 1 0 0 0 0-1.4z"></path>
                </svg>
            </button>
        </div>

        <nav class="sidebar-nav">

            <a th:href="@{/dashboard}" class="sidebar-link active">
                <span class="sidebar-link-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"></path>
                    </svg>
                </span>
                <span class="sidebar-link-text">Dashboard</span>
            </a>

            <a th:href="@{/usuarios}" class="sidebar-link">
                <span class="sidebar-link-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5z"></path>
                    </svg>
                </span>
                <span class="sidebar-link-text">Usuarios</span>
            </a>

            <a th:href="@{/proyectos}" class="sidebar-link">
                <span class="sidebar-link-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M19 3H5a2 2 0 0 0-2 2v14l4-3h12a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"></path>
                    </svg>
                </span>
                <span class="sidebar-link-text">Proyectos</span>
            </a>

            <a th:href="@{/tareas}" class="sidebar-link">
                <span class="sidebar-link-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M9 16.17 4.83 12 3.41 13.41 9 19l12-12-1.41-1.41z"></path>
                    </svg>
                </span>
                <span class="sidebar-link-text">Tareas</span>
            </a>

            <a th:href="@{/configuracion}" class="sidebar-link">
                <span class="sidebar-link-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M19.14 12.94a7.48 7.48 0 0 0 .05-.94 7.48 7.48 0 0 0-.05-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.28 7.28 0 0 0-1.63-.94l-.36-2.54A.49.49 0 0 0 13.9 2h-3.8a.49.49 0 0 0-.49.42l-.36 2.54a7.28 7.28 0 0 0-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.48a.5.5 0 0 0 .12.64l2.03 1.58a7.48 7.48 0 0 0-.05.94 7.48 7.48 0 0 0 .05.94L2.83 14.16a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96c.5.39 1.05.71 1.63.94l.36 2.54a.49.49 0 0 0 .49.42h3.8a.49.49 0 0 0 .49-.42l.36-2.54c.58-.23 1.13-.55 1.63-.94l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64zM12 15.5A3.5 3.5 0 1 1 15.5 12 3.5 3.5 0 0 1 12 15.5z"></path>
                    </svg>
                </span>
                <span class="sidebar-link-text">Configuración</span>
            </a>

        </nav>

        <div class="sidebar-footer">
            <div class="sidebar-user">
                <div class="sidebar-user-avatar">W</div>
                <div class="sidebar-user-info">
                    <strong>Will</strong>
                    <span>Administrador</span>
                </div>
            </div>

            <form th:action="@{/logout}" method="post" class="sidebar-logout-form">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

    <button type="submit" class="sidebar-logout">
        <span class="sidebar-link-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M10 17v-2h4v-6h-4V7h6v10zm9-5-4-4v3H7v2h8v3zM5 21h8v-2H5V5h8V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2z"></path>
            </svg>
        </span>
        <span class="sidebar-link-text">Cerrar sesión</span>
    </button>
</form>
        </div>
    </aside>

</th:block>
